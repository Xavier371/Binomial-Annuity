<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Games</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Main selection screen */
        #menu {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        /* Main buttons */
        #menu button {
            padding: 18px 45px;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        #menu button:hover {
            background: #1d4ed8;
        }

        /* Game area */
        #game {
            display: none;
        }

        /* Switcher at top of game */
        #gamebar {
            height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 10px;
            border-bottom: 1px solid #ccc;
            background: white;
        }

        #gamebar button {
            padding: 7px 18px;
            font-size: 15px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #gamebar button:hover {
            background: #1d4ed8;
        }

        /* Game itself */
        #gameframe {
            width: 100%;
            height: calc(100vh - 51px);
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <!-- Main selection screen -->
    <div id="menu">
        <button onclick="openGame('index.html')">Binomial</button>
        <button onclick="openGame('index2.html')">Annuity</button>
    </div>


    <!-- Game screen -->
    <div id="game">

        <div id="gamebar">
            <button onclick="openGame('index.html')">Binomial</button>
            <button onclick="openGame('index2.html')">Annuity</button>
        </div>

        <iframe id="gameframe"></iframe>

    </div>


    <script>
        function openGame(file) {
            document.getElementById("menu").style.display = "none";
            document.getElementById("game").style.display = "block";
            document.getElementById("gameframe").src = file;
        }
    </script>

</body>
</html>
